[project]
name = "baywa-challenge"
version = "0.1.0"
description = "BayWa r.e. Wind Turbine Outage Energy Loss Estimation"
readme = "README.md"
authors = [
    { name = "invidiae", email = "camilloblomberg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
